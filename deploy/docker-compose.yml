services:
  pantry:
    image: ghcr.io/rhionin/pantry:${PANTRY_IMAGE_TAG:-latest}
    container_name: pantry
    restart: unless-stopped
    # IPv4 only. The short form "8080:8080" also listens on [::]. A global
    # IPv6 address on the Pi would then expose this unauthenticated port even
    # when the router forwards only 80 and 443. LAN clients still use the
    # Pi's IPv4 address. Binding here does not stop a router forward of
    # HOST_PORT; that packet still arrives on this address. See README.
    ports:
      - "0.0.0.0:${HOST_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=16m
    pids_limit: 256
    environment:
      ADDR: ":8080"
      DB_PATH: /data/pantry.db
      PRODUCT_CACHE_TTL: ${PRODUCT_CACHE_TTL:-720h}
      PRODUCT_MISS_TTL: ${PRODUCT_MISS_TTL:-168h}
      DISABLE_EXTERNAL_PRODUCT_LOOKUP: ${DISABLE_EXTERNAL_PRODUCT_LOOKUP:-false}
      PANTRY_RETAILER_API_KEY: ${PANTRY_RETAILER_API_KEY:-}
      PANTRY_RETAILER_API_URL: ${PANTRY_RETAILER_API_URL:-}
      # Optional Product Opener account. Empty means opted-in products are
      # saved locally and never sent. Do not invent these values.
      PRODUCT_OPENER_USER_ID: ${PRODUCT_OPENER_USER_ID:-}
      PRODUCT_OPENER_PASSWORD: ${PRODUCT_OPENER_PASSWORD:-}
      STOCK_IN_CONTROL_BARCODE: ${STOCK_IN_CONTROL_BARCODE:-STOCK_IN}
      STOCK_OUT_CONTROL_BARCODE: ${STOCK_OUT_CONTROL_BARCODE:-STOCK_OUT}
      HEADLESS_USER_ID: ${HEADLESS_USER_ID:-user-1}
      SCAN_INPUT: device
      SCANNER_DEVICE: ${SCANNER_DEVICE:-/dev/input/pantry-scanner}
      SCANNER_GID: ${SCANNER_GID:-65532}
      # Shared with GitHub Actions. Empty disables POST /api/deploy-hook.
      # The value stays in /opt/pantry/.env; setup.sh generates it once.
      DEPLOY_HOOK_SECRET: ${DEPLOY_HOOK_SECRET:-}
      DEPLOY_TRIGGER_PATH: /deploy-trigger/request
      # Empty on a LAN-only install. setup.sh copies auth.caddy here when the
      # public site has a password, and leaves the LAN listener alone.
      # The file is mode 0600 and owned by uid 65532, this image's nonroot
      # user. A root-owned file is unreadable once capabilities are dropped.
      PANTRY_AUTH_FILE: /etc/pantry/auth/household
      PANTRY_SESSION_SECRET: ${PANTRY_SESSION_SECRET:-}
    volumes:
      - pantry-data:/data
      # The process writes one file here. A host path unit starts the update.
      # The directory is created by setup.sh and owned by uid 65532, which is
      # the distroless nonroot user. Docker would otherwise create it as root
      # and the hook could not write.
      - ./deploy-trigger:/deploy-trigger
      - ./auth:/etc/pantry/auth:ro
      # Bind-mount the /dev/input directory (not a single node) so that device
      # nodes udev creates later become visible inside the container without
      # recreating it. Read-only is safe: openEvdev opens O_RDONLY, and
      # EVIOCGRAB does not require write permission.
      - /dev/input:/dev/input:ro
    device_cgroup_rules:
      # Grant the input device class (char major 13) read access at the cgroup layer.
      # This is an allowance, not a grant—file ownership and mode still decide what
      # is openable. Without this, the container cannot open the node even though
      # it can see it after the mount.
      - 'c 13:* r'
    group_add:
      - "${SCANNER_GID:-65532}"

  # Opt-in HTTPS in front of pantry. Omitted from a normal `docker compose up`
  # so a LAN install does not publish 80/443 or request a certificate.
  # Enable with: docker compose --profile public up -d
  # `sudo ./setup.sh` does this when PUBLIC_HOST is set and auth.caddy exists.
  caddy:
    profiles: ["public"]
    image: caddy:2.11.7-alpine
    container_name: pantry-caddy
    restart: unless-stopped
    depends_on:
      - pantry
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pantry-data:
  caddy-data:
  caddy-config:
# Cloudflare Tunnel publish path. setup.sh appends this file only when
# CLOUDFLARE_TUNNEL_TOKEN is set (or PUBLISH_MODE=tunnel / --tunnel).
# A plain `docker compose -f docker-compose.yml --profile public` never
# reads this file, so the certificate path is unchanged.
#
# Remotely managed tunnel pantry-pi
# (9e158cce-4d31-4881-82f3-d905af6164e7). Ingress is set in Cloudflare,
# not in a file here. Public hostname in Zero Trust → Networks → Tunnels:
#   pantry.rhionin.com  →  http://caddy:80
# `caddy` is an alias on cf-tunnel. cloudflared is the only member of that
# network besides Caddy, at 10.77.77.2. Caddyfile.tunnel trusts
# X-Forwarded-Proto and CF-Connecting-IP from that address only.

services:
  caddy-tunnel:
    profiles: ["tunnel"]
    image: caddy:2.11.4-alpine
    container_name: pantry-caddy
    restart: unless-stopped
    depends_on:
      - pantry
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-}
    security_opt:
      - no-new-privileges:true
    networks:
      default: {}
      cf-tunnel:
        aliases:
          - caddy
    volumes:
      - ./Caddyfile.tunnel:/etc/caddy/Caddyfile:ro
      - ./auth.caddy:/etc/caddy/auth.caddy:ro
      - caddy-data:/data
      - caddy-config:/config

  cloudflared:
    profiles: ["tunnel"]
    # Multi-arch manifest, including linux/arm64 for the Pi. The image
    # entrypoint is `cloudflared --no-autoupdate`, so this is `tunnel run`
    # and the binary does not try to replace itself. The token is the
    # TUNNEL_TOKEN env var, not a command argument.
    image: cloudflare/cloudflared:2026.10.0
    container_name: pantry-cloudflared
    restart: unless-stopped
    command: ["tunnel", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy-tunnel
    security_opt:
      - no-new-privileges:true
    networks:
      cf-tunnel:
        ipv4_address: 10.77.77.2

networks:
  cf-tunnel:
    driver: bridge
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: 10.77.77.0/29

name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  packages: write

jobs:
  validate:
    # Tests still gate the version tag. This reusable run must not push
    # :latest or :master; the push-triggered CI workflow already does, and
    # that run is the one deploy-hook call.
    uses: ./.github/workflows/ci.yml
    with:
      publish_image: skip

  tag-release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push version tag
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          # Same formula the image stamps into GET /api/build (see ci.yml).
          VERSION="v$(date -u +%Y%m%d)-$(git rev-parse --short=7 HEAD)"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  go:
    name: Go tests and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      
      - name: Install bc (required by coverage script)
        run: sudo apt-get update && sudo apt-get install -y bc
      
      - name: Run Go tests with coverage
        run: ./scripts/test-coverage.sh

  frontend:
    name: Frontend tests and linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npx tsc -b
      
      - name: Lint code
        run: npm run lint
      
      - name: Run tests
        run: npx vitest --run

  docker:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs: [go, frontend]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.repository == 'Rhionin/pantry')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tags=ghcr.io/rhionin/pantry:latest,ghcr.io/rhionin/pantry:master,ghcr.io/rhionin/pantry:${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "tags=ghcr.io/rhionin/pantry:${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.tags.outputs.tags }}
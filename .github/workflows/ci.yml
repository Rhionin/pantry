name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_call:
    inputs:
      # String, not boolean. On push and pull_request this input is unset, and
      # a boolean's zero value is false, which would skip the only publisher.
      # Release passes skip. Any other value, including unset, still publishes.
      publish_image:
        description: Pass skip to avoid building and pushing the container image.
        type: string
        required: false
        default: publish

permissions:
  contents: read
  packages: write

jobs:
  go:
    name: Go tests and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      
      - name: Install bc (required by coverage script)
        run: sudo apt-get update && sudo apt-get install -y bc
      
      - name: Run Go tests with coverage
        run: ./scripts/test-coverage.sh
  
  go-build-all-platforms:
    name: Go build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      
      - name: Build all packages
        run: go build ./...

  shell:
    name: Shell script linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      
      - name: Lint deploy shell scripts
        run: shellcheck deploy/setup.sh deploy/systemd/pantry-update.sh deploy/firewall/pantry-lan-only.sh deploy/setup_apply_test.sh deploy/mdns/pantry-mdns.sh deploy/dns/pantry-split-dns.sh deploy/mdns/lan-ipv4.sh deploy/publish-mode.sh deploy/check-publish-modes.sh deploy/check-deploy-hook.sh deploy/auth-migrate.sh

      - name: Setup script syntax and behavior
        run: bash -n deploy/setup.sh deploy/firewall/pantry-lan-only.sh deploy/systemd/pantry-update.sh deploy/mdns/pantry-mdns.sh deploy/mdns/lan-ipv4.sh deploy/dns/pantry-split-dns.sh deploy/publish-mode.sh deploy/check-publish-modes.sh deploy/check-deploy-hook.sh deploy/auth-migrate.sh && bash deploy/setup_apply_test.sh

      - name: Publish modes compose config and Caddyfile adapt
        run: bash deploy/check-publish-modes.sh

      - name: Deploy hook contract
        run: bash deploy/check-deploy-hook.sh

  frontend:
    name: Frontend tests and linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npx tsc -b
      
      - name: Lint code
        run: npm run lint
      
      - name: Run tests
        run: npx vitest --run

  e2e:
    name: Frontend e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Build server binary
        run: go build -o ../bin/pantry-server ../cmd/server
      
      - name: Run Playwright e2e tests
        run: npx playwright test
      
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs: [go, frontend, shell, e2e]
    # One publisher per master commit. Release reuses this workflow, and the
    # github context there is still the caller's push, so event_name cannot
    # tell the two runs apart. The reusable run passes publish_image skip
    # and skips this job. The push-triggered run is the only one that tags
    # :latest and :master, and the only one that calls the deploy hook below.
    if: inputs.publish_image != 'skip' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.repository == 'Rhionin/pantry'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          # Build common tags array - always include commit hash
          TAGS="ghcr.io/rhionin/pantry:${{ github.sha }}"
          
          # Add branch name tag for all builds (PR and master)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH_NAME="${{ github.head_ref }}"
            # Remove 'refs/heads/' prefix if present
            BRANCH_NAME="${BRANCH_NAME#refs/heads/}"
            # Replace slashes with dashes for valid tag
            BRANCH_NAME="${BRANCH_NAME//\//-}"
            TAGS="$TAGS,ghcr.io/rhionin/pantry:$BRANCH_NAME"
          else
            # On master commit, add latest and master tags
            TAGS="$TAGS,ghcr.io/rhionin/pantry:latest,ghcr.io/rhionin/pantry:master"
          fi
          
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Read commit identity
        id: commit
        run: |
          # Same commit the image is tagged with (github.sha / the checkout).
          # Base64 keeps the subject a single build-arg: quotes and spaces
          # never reach the Dockerfile, where $$ would be the shell PID.
          # version matches the annotated tag in release.yml: v<UTC date>-<7 char sha>.
          short=$(git rev-parse --short=7 HEAD)
          {
            echo "time=$(git log -1 --format=%cI)"
            echo "subject_b64=$(git log -1 --format=%s | tr -d '\r\n' | base64 -w 0)"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "version=v$(date -u +%Y%m%d)-${short}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}
            COMMIT_TIME=${{ steps.commit.outputs.time }}
            COMMIT_SUBJECT_B64=${{ steps.commit.outputs.subject_b64 }}
            BUILD_TIME=${{ steps.commit.outputs.built_at }}
            VERSION=${{ steps.commit.outputs.version }}

      # The image is already in the registry. This asks the Pi to pull it now.
      # The step is a no-op until DEPLOY_HOOK_SECRET exists, so a repo without
      # that secret still publishes the image and the Pi timer still deploys.
      - name: Ask the Pantry host to deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          DEPLOY_HOOK_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
        run: |
          if [ -z "${DEPLOY_HOOK_SECRET}" ]; then
            echo "DEPLOY_HOOK_SECRET is not set; skipping the deploy hook. The Pi timer will pull this image."
            exit 0
          fi
          url="https://pantry.rhionin.com/api/deploy-hook"
          body="{\"sha\":\"${GITHUB_SHA}\",\"ref\":\"${GITHUB_REF_NAME}\"}"
          ts="$(date +%s)"
          sig="$(printf '%s.%s' "$ts" "$body" | openssl dgst -sha256 -hmac "$DEPLOY_HOOK_SECRET" -hex | awk '{print $NF}')"
          curl --fail --silent --show-error --max-time 30 \
            -X POST "$url" \
            -H "Content-Type: application/json" \
            -H "X-Pantry-Deploy-Timestamp: ${ts}" \
            -H "X-Pantry-Deploy-Signature: ${sig}" \
            --data-binary "$body"
          echo "Deploy hook accepted for ${GITHUB_SHA}."